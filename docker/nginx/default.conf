# KnittingTracker static PWA (ADR-7). Runs as non-root on port 8080 (nginx-unprivileged).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    charset_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    # Compression: serve precompressed .gz when present, otherwise compress on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json
               application/manifest+json image/svg+xml text/plain;

    # Liveness for Docker/compose healthchecks.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Hashed build output: cache forever.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Service worker and app entry points must always be revalidated, or updates never arrive.
    location ~ ^/(sw\.js|registerSW\.js|index\.html)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Anything that looks like a file but does not exist is a real 404 (never index.html, so a
    # missing script can't be cached as HTML by the service worker).
    location ~ \.[A-Za-z0-9]+$ {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA: unknown paths fall back to index.html (client-side routing).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
