name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  HUSKY: '0'

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Forbidden content (R-5)
        run: pnpm check:forbidden
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit tests with coverage gate
        run: pnpm test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - run: pnpm build
      - name: Startup bundle budget
        run: pnpm check:bundle
        env:
          VITE_APP_ENV: prod
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  e2e:
    name: E2E (phone iOS/Android, tablet, desktop)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @kt/web exec playwright install --with-deps chromium webkit
      - run: pnpm build
        env:
          VITE_APP_ENV: test
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  docker:
    name: Docker image build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: knitting-tracker-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container and check health and headers
        run: |
          docker run -d --name kt --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true -p 8080:8080 knitting-tracker-web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8080/
          cat headers.txt
          grep -qi '^content-security-policy:' headers.txt
          grep -qi '^cache-control: no-cache' headers.txt
          test "$(docker inspect -f '{{.Config.User}}' kt)" = "101"
      - name: Container logs
        if: always()
        run: docker logs kt || true

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
